<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png">
  <meta charset="UTF-8">
  <title>Set New Password - SRI CUMIN SEEDS CATERING SERVICES</title>
  <link rel="stylesheet" href="css/styles.css?v=2">
</head>

<body>
  <div class="auth-container">
    <div class="glass-panel auth-box">
      <h2 style="text-align: center; margin-bottom: 1.5rem;">New Password</h2>
      <form id="reset-form">
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="new-password" required minlength="6">
        </div>
        <p id="reset-msg" style="color: green; font-size: 0.9rem; display: none;"></p>
        <p id="reset-error-msg" style="color: red; font-size: 0.9rem; display: none;"></p>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Update Password</button>
      </form>
    </div>
  </div>
  <script src="js/forgot.js?v=2"></script>
</body>

</html>
